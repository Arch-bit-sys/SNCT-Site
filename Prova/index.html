<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prova de Investigação</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Prova de Investigação</h1>
    <p id="status" role="status" aria-live="polite"></p>

    <form id="nome-form">
      <label for="nome">Nome do jogador</label>
      <input id="nome" name="nome" maxlength="80" autocomplete="name"
             placeholder="Digite seu nome" required>
      <button type="submit" id="continuar">Continuar</button>
    </form>

    <section id="etapa-prova" hidden>
      <label for="tipo-prova">Escolha a prova</label>
      <select id="tipo-prova">
        <option value="">Selecione uma prova</option>
      </select>

      <div id="pergunta-area"></div>
      <button type="button" id="prosseguir" disabled>Prosseguir</button>
    </section>

    <section id="conclusao" hidden>
      <h2>Prova concluída!</h2>
      <p id="resultado-final"></p>
    </section>
  </main>
</body>
</html>
